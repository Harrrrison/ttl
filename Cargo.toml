[package]
name = "ttm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal task manager with a gantt timeline and an agent-friendly JSON store"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
fs2 = "0.4"
open = "5.4.4"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2.2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.clippy]
all = "warn"

[lints.rust]
missing_debug_implementations = "warn"
